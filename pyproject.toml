# Not a distributable package — this is a Claude Code plugin, installed by copying
# the directory. The file exists for the two things nothing else was stating:
# which Python versions the code actually runs on, and how the linter is configured.
[project]
name = "seo-checklist"
version = "0.176.0"
description = "Deterministic SEO audit against a fixed 217-item registry"
license = "MIT"
# 3.11 since 0.166.0, by Anton's decision of 15 October 2026: an old Python that
# needs patches raises the floor rather than keeping them. 3.10 needed two, and both
# are gone: `server_log_audit.py` turned a trailing `Z` into `+00:00` because
# `datetime.fromisoformat` refuses it before 3.11, and a test read this file by regex
# because `tomllib` is 3.11's. Installed by copying, the plugin is not stopped by this
# line, so every program refuses an older Python itself (`scripts/lib/python_floor.py`,
# whose `REQUIRES` a test holds to this string).
#
# The lowest version in the CI matrix is tied to this string by a test, because the
# usual way this claim goes stale is a floor that nothing ever exercises.
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Script families that only some runs need. Search Console items report NO_DATA
# without the google packages rather than failing, which is the point of keeping
# them out of the base set.
gsc = ["google-auth>=2.29", "google-api-python-client>=2.125"]
# PyYAML is how `tools/ci_local.py` and `tests/test_ci_local.py` read the workflow.
# Nothing shipped parses YAML, so it is here and not in the base set.
dev = ["ruff>=0.5", "pyyaml>=6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "plugin-snapshot"]

[tool.ruff.lint]
# Deliberately narrow, and chosen by what has actually gone wrong here rather than
# by what a linter can say. `F` is the one that would have caught real defects: an
# undefined name, a shadowed import, a variable assigned and never read. `E`
# without the whitespace rules keeps the diff to things a reader would also call
# wrong. Style beyond that is not the failure mode this project has — the failures
# have all been assertions that could not fire, and no linter finds those.
select = ["F", "E4", "E7", "E9", "W6", "B"]

[tool.ruff.lint.per-file-ignores]
# The tests reach into module internals on purpose — that is what testing a
# 55-script surface through its real seams looks like.
"tests/*" = ["E402"]
