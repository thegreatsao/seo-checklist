name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is the floor declared in pyproject.toml, and it is here because a
        # declared floor nothing runs is a guess. It is a real floor: three scripts
        # annotate with PEP 604 unions and no `from __future__ import annotations`,
        # so on 3.9 they raise TypeError at import — before any check runs and with
        # nothing in the message about SEO. A test ties this list to that string.
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff


      # ruff was listed as a development dependency and never ran. Running it found
      # two half-implemented checks: a computed signal dropped instead of reported
      # in `entity_checker.py`, and another in `hreflang_checker.py`. That is the
      # same family as every other defect in this repository's history — code that
      # looks like it decides something and does not.
      - name: Lint
        run: ruff check .

      # The registry is generated, so a stale checklist.json means the committed
      # contract and its generator disagree about what an audit covers.
      - name: Registry is in step with its generator
        run: python skills/seo-checklist/tools/build_checklist.py --check

      # Every test here is offline by design: nothing in CI should depend on a
      # live site, an API key, or somebody's Search Console property.
      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Scripts compile
        run: |
          python -m compileall -q skills/seo-checklist/scripts skills/seo-checklist/tools

      # An assertion whose pattern cannot match anything its script emits reports
      # PASS for every site, silently. Fifteen were in that state, one of them a
      # critical item. A test covers this; the step makes the failure legible.
      - name: No assertion can never fire
        run: python skills/seo-checklist/tools/audit_assertions.py

      # The quietest of the three, and the one nothing watched until 0.46: an
      # assertion that fires correctly, on the right field, and can only ever come
      # out one way. KW-076 asserted a field `article_seo.py` wrote only when it
      # already held something, so the item reported PASS or NO_DATA on every site
      # for years. Some rules are unfailable on purpose — TE-179's warn band is its
      # assertion's exact complement — so the tool proves the mechanism from the
      # script's own source and checks it against what the registry declares, in
      # both directions and on the mechanism. It also audits the other unreachable
      # verdict: CN-048 promised a WARN over a script that grades everything it
      # finds as an error, so the band could not fire on any page ever built.
      - name: No verdict is unreachable without saying so
        run: python skills/seo-checklist/tools/audit_reachability.py

      # The other half of that objection: an assertion that fires correctly, on the
      # wrong thing. Held out of CI through 0.20 and 0.21 because it exited 1 on the
      # registry as shipped, and a required check that is red by default is a check
      # nobody reads. Green as of 0.22 — every duplicate group is a recorded pairing
      # and every vocabulary miss carries a written ruling — so it can hold the line
      # from here. An item added with no ruling, or one sharing another's assertion
      # without SAME_CHECK saying so, now fails the build.
      - name: Every item asserts what its title says
        run: python skills/seo-checklist/tools/audit_item_semantics.py

      # 0.19.0 translated all 214 items and 0.20 changed one item's English fix text
      # without touching the Russian. Every i18n test stayed green: the translation
      # existed, was not blank and was in Cyrillic. Presence is not parity, so each
      # translation now carries a digest of the English it was written against.
      - name: No translation has drifted from its English
        run: python skills/seo-checklist/tools/i18n_digest.py --check

      # The Public Suffix List is a dated artifact. Its absence is not a crash,
      # it is a quiet downgrade to the heuristic it replaced, so the shipped
      # snapshot is checked rather than assumed. --check downloads nothing.
      - name: Public suffix snapshot ships and is dated
        run: python skills/seo-checklist/tools/refresh_public_suffix_list.py --check

      # KNOWN-ISSUES.md is the one file here that makes claims about the code and had
      # no reader, so three entries went on describing a tree that had been repaired
      # underneath them - KW-071 for 36 releases. Each section 6 entry now carries a
      # marker and either a probe or a written reason for having none; this re-runs the
      # probes. A failure is not "fix the code": it is somebody deciding whether the
      # tree moved or the entry is now wrong, and then re-recording.
      - name: The defect list still describes this tree
        run: python tests/known_issues.py --check

      # The other recorded ledger, and the cheap half of the same question. It asserts
      # that the record still describes the tree - which findings each none_severity
      # script can write that no rule reads - and not that any of them is acceptable
      # advice; that judgement has no mechanical form and this tool deliberately makes
      # none. The census answers the same question about verdicts and costs five
      # audits, so it has a job of its own below rather than a step in this matrix.
      - name: The inert-findings record still describes this tree
        run: python tests/inert_findings.py --check tests/inert-findings.json

      # A smoke run against a local page proves the whole path still works end to
      # end — registry, runner, report — without touching the network.
      - name: Offline smoke run
        run: |
          mkdir -p /tmp/site
          cat > /tmp/site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>CI smoke page</title>
          <meta name="description" content="A page used only to prove the audit runs end to end.">
          <link rel="canonical" href="https://ci.example/"></head>
          <body><h1>CI smoke page</h1><p>Body copy.</p></body></html>
          HTML
          python skills/seo-checklist/scripts/checklist_runner.py https://ci.example/ \
              --archive /tmp/site --no-history --quiet
          python skills/seo-checklist/scripts/checklist_report.py checklist-results.json --no-html
          python skills/seo-checklist/scripts/checklist_report.py checklist-results.json --no-html --lang ru

      # A site that cannot be read must produce no score. Evidence scripts exit 0
      # with empty output when they fetch nothing, and empty output satisfies the
      # assertions this registry is built from — that combination once scored a
      # host that does not resolve at 61/100. Unit tests cover the gate; this
      # proves the whole path still honours it.
      - name: An unreachable site gets no score
        run: |
          python skills/seo-checklist/scripts/checklist_runner.py \
              https://unreachable.invalid/ --mode page --no-history --no-prompt \
              --quiet --timeout 20 --json dead.json > dead.log 2>&1 || true
          grep -q UNREACHABLE dead.log || { echo "no unreachable warning"; cat dead.log; exit 1; }
          if grep -q "SEO Score" dead.log; then echo "scored a site it never read"; exit 1; fi
          python - <<'PY'
          import json
          d = json.load(open("dead.json"))
          assert d["entry_reachable"] is False, "entry_reachable not recorded"
          assert d["scores"]["decided"] == 0, f"decided {d['scores']['decided']} items"
          bad = [i["id"] for i in d["items"] if i["status"] in ("PASS", "FAIL", "WARN")]
          assert not bad, f"verdicts without a site: {bad[:5]}"
          PY

      # The other half of the same failure, and the harder half: a bot-protection
      # challenge and a soft 404 answer 200 with well-formed HTML, so the status
      # gate above waves them through and every script grades an interstitial as
      # if it were the site. Run offline against saved copies of both, which is
      # exactly the shape of the real thing.
      - name: A challenge page and a soft 404 get no score
        run: |
          mkdir -p /tmp/challenge /tmp/soft404
          cat > /tmp/challenge/index.html <<'HTML'
          <!doctype html><html><head><title>Just a moment...</title></head>
          <body><h1>Checking your browser</h1>
          <script src="/cdn-cgi/challenge-platform/h/b/orchestrate/chl_page/v1"></script>
          </body></html>
          HTML
          cat > /tmp/soft404/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>404 Not Found | Example Shop</title>
          <link rel="canonical" href="https://example.com/missing"></head>
          <body><h1>Page not found</h1><p>Try the homepage.</p></body></html>
          HTML
          for kind in challenge soft404; do
            python skills/seo-checklist/scripts/checklist_runner.py https://example.com/ \
                --archive /tmp/$kind --no-history --no-prompt --quiet \
                --json $kind.json > $kind.log 2>&1
            if grep -q "SEO Score" $kind.log; then
              echo "scored a $kind page"; cat $kind.log; exit 1
            fi
            python - "$kind" <<'PY'
          import json, sys
          kind = sys.argv[1]
          d = json.load(open(f"{kind}.json"))
          assert d["entry_guard"], f"{kind}: guard did not fire"
          assert d["entry_guard_enforced"] is True, f"{kind}: guard not enforced"
          assert d["scores"]["decided"] == 0, f"{kind}: decided {d['scores']['decided']}"
          bad = [i["id"] for i in d["items"] if i["status"] in ("PASS", "FAIL", "WARN")]
          assert not bad, f"{kind}: verdicts on the wrong page: {bad[:5]}"
          PY
          done

      # And the mirror image: an article that quotes a vendor's challenge string
      # in its prose is a real page and must still be audited. Refusing to audit
      # it would be the same bug pointing the other way.
      - name: An article about bot protection is still audited
        run: |
          mkdir -p /tmp/article
          cat > /tmp/article/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>How to fix 404 errors on your site | Example</title>
          <meta name="description" content="Finding and fixing broken links and soft 404s.">
          <link rel="canonical" href="https://example.com/fix-404"></head>
          <body><h1>How to fix 404 errors</h1><p>Cloudflare serves its interstitial
          from cdn-cgi/challenge-platform, which is why a crawler sees something
          different from a browser.</p></body></html>
          HTML
          python skills/seo-checklist/scripts/checklist_runner.py https://example.com/ \
              --archive /tmp/article --no-history --no-prompt --quiet \
              --json article.json > article.log 2>&1
          grep -q "SEO Score" article.log || {
            echo "refused to audit a real page"; cat article.log; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open("article.json"))
          assert d["entry_guard"] is None, f"guard fired on a real page: {d['entry_guard']}"
          assert d["scores"]["decided"] > 0, "decided nothing on a readable page"
          PY

      # The live path, against a site this job serves itself.
      #
      # Everything above is offline, and offline is where the worst bug in this
      # plugin's history hid: a slot file opened "a+" appended instead of replacing,
      # float() raised out of the rate limiter, and 36 of 56 evidence scripts
      # crashed in a live run while every test passed. Nothing offline could have
      # caught it — a single process writing to a fresh file never appends twice.
      #
      # It could not be tested because the SSRF guard had no way through, so the
      # only live target available was somebody else's website. --allow-private is
      # what makes this step possible, and this step is most of why it exists.
      - name: The full live path, against a locally served fixture site
        run: |
          python -m http.server 8000 --directory tests/fixtures/good > server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8000/ && break || sleep 0.5
          done
          curl -sf -o /dev/null http://127.0.0.1:8000/ || { echo "fixture server never came up"; exit 1; }

          # The guard first: the default must still refuse. If this ever passes,
          # every audit is one DNS answer away from reaching a private network.
          python skills/seo-checklist/scripts/checklist_runner.py http://127.0.0.1:8000/ \
              --no-history --no-prompt --quiet --timeout 60 --json blocked.json \
              > blocked.log 2>&1 || true
          grep -q "private/internal IP" blocked.log || {
            echo "the SSRF guard did not refuse a loopback host by default"
            cat blocked.log; exit 1; }
          if grep -q "SEO Score" blocked.log; then
            echo "scored a host it was not allowed to read"; exit 1; fi

          # Then the real thing: crawl, sample, pace, aggregate, report.
          # SEO_MAX_RPS is raised rather than switched off, deliberately — the
          # pacing must run, with several processes contending for the same slot
          # file, because that contention is the bug this step exists to catch.
          #
          # The log is emptied first so the count below is the audit's own. The two
          # readiness curls and the SSRF-guard run above are not part of what is
          # being measured, and a number that quietly includes them is a number that
          # cannot be compared with the one in KNOWN-ISSUES.
          : > server.log
          python skills/seo-checklist/scripts/checklist_runner.py http://127.0.0.1:8000/ \
              --allow-private --sample 3 --max-rps 50 --no-history --no-prompt \
              --timeout 90 --json live.json > live.log 2>&1
          grep -q "SEO Score" live.log || {
            echo "no score"; cat live.log; tail -40 server.log; exit 1; }
          python - <<'PY'
          import collections, re, sys

          # The request fan-out, asserted rather than printed: a number in a green
          # build is a number nobody reads. It went 97 (0.8.0) -> 201 -> 20 for this
          # exact command, as the shared crawl and then the response cache landed;
          # see KNOWN-ISSUES 1 for the table. Raise these deliberately or not at all.
          seen = collections.Counter()
          for line in open("server.log"):
              m = re.search(r'"(GET|HEAD) (\S+) HTTP', line)
              if m:
                  seen[m.groups()] += 1
          total = sum(seen.values())
          print(f"one audit of a 6-page site, 3 pages sampled, made {total} "
                f"requests for {len(seen)} distinct (method, path) pairs")
          for (method, path), n in sorted(seen.items(), key=lambda kv: -kv[1]):
              print(f"    {n:>3}  {method} {path}")
          bad = []
          if total > 40:
              bad.append(f"{total} requests is past the ceiling of 40")
          # One page, one fetch. This is the whole claim of the response cache, and
          # the only place it is checked against a real audit end to end.
          if seen.get(("GET", "/"), 0) != 1:
              bad.append(f'the entry URL was fetched {seen.get(("GET", "/"), 0)}x '
                         f'as a GET, not once')
          # Two requests for one URL happen twice here, both deliberately:
          #
          #   HEAD on a sampled page — redirect_checker asks with redirects off
          #   because the hop is what it reports, while the hreflang and cache-header
          #   checks ask with them on. Different requests, different cache entries.
          #
          #   GET /robots.txt — once as the policy the crawler obeys (fetched outside
          #   safe_request, which cannot consult it without recursing) and once as the
          #   document robots_checker.py audits. Different consumers with different
          #   failure semantics: the policy fetch fails open, the audit fetch reports.
          #
          # Three of anything would mean something stopped sharing.
          worse = {f"{m} {p}": n for (m, p), n in seen.items() if n > 2}
          if worse:
              bad.append(f"a URL was requested more than twice: {worse}")
          if bad:
              sys.exit("\n".join("  " + b for b in bad))
          PY
          python skills/seo-checklist/scripts/checklist_report.py live.json \
              --markdown live.md --html live.html --llm-queue live-queue.md > report.log 2>&1
          python - <<'PY'
          import json
          d = json.load(open("live.json"))

          # The assertion this whole step is for. Every one of these is a script
          # that failed against a site that was serving perfectly.
          assert not d["script_failures"], (
              f"scripts failed against the fixture site: {d['script_failures']}\n"
              + "\n".join(f"  {k}: {v['error']}" for k, v in d["runs"].items()
                          if v.get("error")))

          # One crawl, and the ten site-wide checks read it. Before this the same
          # pages were walked six times over and no item could name a broken URL.
          crawl = d.get("crawl")
          assert crawl and not crawl.get("error"), f"the shared crawl did not run: {crawl}"
          assert crawl["summary"]["pages_fetched"] >= 5, crawl["summary"]
          assert crawl["summary"]["requests"] <= crawl["summary"]["pages_fetched"] + 10, (
              f"the crawl made requests it does not account for: {crawl['summary']}")
          undecided = [i["id"] for i in d["items"]
                       if i["id"] in {"CI-008", "MS-022", "MS-029", "CN-039", "CN-041",
                                      "BL-081", "GO-137", "AR-149", "AR-162", "TE-168"}
                       and i["status"] == "NO_DATA"]
          assert not undecided, (
              f"items reading the shared crawl came back NO_DATA: {undecided}")

          assert d["allow_private"] is True, "the flag is not in the artifact"
          assert d["entry_private"] is True, "a loopback host was not recognised as private"
          assert d["entry_reachable"] is True and not d["entry_guard"], d.get("entry_error")
          assert d["scores"]["decided"] > 50, (
              f"only {d['scores']['decided']} items decided — the evidence layer "
              f"did not really run")
          assert len(d["sampled_urls"]) > 1, "sampling found nothing to sample"

          # An external service cannot reach a host on this runner, so those items
          # are NO_DATA with that reason — not crashes, and not N/A: they apply to
          # this site, they just cannot be answered here.
          outside = [i for i in d["items"] if "only reachable from here" in (i.get("evidence") or "")]
          assert outside, "the external-API items were not gated"
          assert all(i["status"] == "NO_DATA" for i in outside), \
              [i["id"] for i in outside if i["status"] != "NO_DATA"]

          # And the deliverable says which kind of audit produced it.
          html, md = open("live.html").read(), open("live.md").read()
          for name, text in (("html", html), ("markdown", md)):
              assert "--allow-private" in text, f"{name} does not say the host was private"
          print(f"live path OK: {d['scores']['seo_score']}/100 at "
                f"{d['scores']['weight_pct']}% of the weight in scope, over "
                f"{len(d['runs'])} script runs")
          PY

          # The fixture's planted defects, checked against the evidence layer
          # directly. A run that finds nothing wrong with a site built to be wrong
          # has stopped measuring and nobody would notice from the score alone.
          SEO_ALLOW_PRIVATE=1 SEO_MAX_RPS=50 python \
              skills/seo-checklist/scripts/orphan_pages_from_sitemap.py \
              http://127.0.0.1:8000/ --json > orphans.json
          python - <<'PY'
          import json
          d = json.load(open("orphans.json"))
          # This is the subtraction, asserted rather than assumed.
          #
          # /private/secret.html is listed in the sitemap and disallowed in
          # robots.txt, so the crawl refuses it and it can never enter `reachable`.
          # Orphans are `sitemap - reachable`, so without subtracting the refusals it
          # is reported as an orphan — our own politeness rendered as the site's
          # defect, on a critical-adjacent item that fails on a single orphan. It is
          # also the ordinary case rather than an edge one: a page is usually
          # unlinked precisely because it is blocked.
          #
          # The good fixture has no real orphans, so both halves are checked at once:
          # zero orphans, one conflict. The orphan-detection direction is covered on
          # the broken fixture by tests/test_contract.py.
          assert d["orphan_pages"] == [], d["orphan_pages"]
          assert d["sitemap_urls_blocked_by_robots"] == [
              "http://127.0.0.1:8000/private/secret.html"], d["sitemap_urls_blocked_by_robots"]
          assert "sitemap_robots_conflict" in [i["type"] for i in d["issues"]]
          assert d["summary"]["orphan_pages"] == 0, d["summary"]
          print("orphan and robots arithmetic OK")
          PY

      # robots.txt governs what the tool discovers, never what it was handed. Both
      # halves fail silently if reversed: a blanket check would refuse the 40-odd
      # scripts that fetch {url} and collapse the audit to NO_DATA, while no check
      # at all crawls somebody's site against their stated wishes. The signature
      # default is the whole guarantee, so it is asserted here as well as in the
      # test suite — this one runs even if the suite is skipped.
      # Calibration, from KNOWN-ISSUES 2: a test can show a threshold fires, it
      # cannot show the threshold is right. This does not try to — it requires every
      # number a verdict depends on to say what it rests on, so a reader who
      # disagrees argues with a stated claim instead of a bare integer. The inventory
      # is printed because the `inherited` count is the honest measure of how much of
      # this registry rests on numbers nobody here decided, and it should fall.
      - name: Every threshold says what it rests on
        run: python skills/seo-checklist/tools/audit_thresholds.py --check

      # The twelve normative documents, summed. Each tabulates its own requirements and
      # tests/test_specs.py checks each tabulation is honest about itself; nothing added
      # them up, so the debt was twelve numbers in twelve files. The record moves only
      # when somebody re-records it, which is the point: a requirement changing class is
      # a decision, not a side effect.
      - name: The suite still owes what it says it owes
        run: python skills/seo-checklist/tools/spec_debt.py --check tests/spec-debt.json

      # The `measured` bases, re-read against the constants they justify. Each check is
      # offline and takes about a second, and all four existed with no CI step for as
      # long as they have existed — so a calibrated constant could move and only a hand
      # run would have noticed. Found while writing specs/governance/, by looking for
      # what each instrument is still pointed at rather than whether it exists.
      - name: Every calibrated constant still matches the report behind it
        run: |
          for t in css_minification font_weight gsc_sample_floors serp_length; do
            python skills/seo-checklist/tools/calibrate_$t.py --check
          done

      - name: How much of the score is the weight table
        run: |
          python skills/seo-checklist/tools/audit_score_sensitivity.py live.json

      - name: robots.txt applies to discovered URLs, not to the audit target
        run: |
          cd skills/seo-checklist/scripts
          python - <<'PY'
          import inspect, sys
          sys.path.insert(0, ".")
          from lib import safe_http as sh
          import seo_common

          for fn in (sh.safe_request, seo_common.fetch_url):
              d = inspect.signature(fn).parameters["respect_robots"].default
              assert d is False, f"{fn.__qualname__} opts in by default ({d!r})"

          assert "/" not in sh.ROBOTS_TOKEN, (
              "the token must be bare: RobotFileParser splits the agent at '/', so a "
              "full User-Agent makes rules naming us silently inapplicable")

          sh._fetch_robots = lambda origin: (_ for _ in ()).throw(RuntimeError("down"))
          assert sh.robots_allows("https://example.com/x") == (True, 0.0), (
              "an unreachable robots.txt must allow, not fail the audit")

          sh._fetch_robots = lambda origin: f"User-agent: {sh.ROBOTS_TOKEN}\nDisallow: /no\n"
          import os, shutil, tempfile
          # Through the environment, which is the only way that reaches a child
          # process — see `rate_limit_dir`. Assigning a module attribute here used to
          # work by accident: this step starts nothing.
          own = tempfile.mkdtemp()
          os.environ[sh.RATE_LIMIT_DIR_VAR] = own
          assert sh.rate_limit_dir() == own
          assert sh.robots_allows("https://example.com/no/x")[0] is False
          assert sh.robots_allows("https://example.com/yes")[0] is True
          shutil.rmtree(own, ignore_errors=True)
          print("robots policy holds")
          PY

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # This job answers a platform question, not the Python-floor syntax question
      # already covered by the Linux matrix, so one current Python version is enough.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff


      - name: Lint
        run: python -m ruff check .

      - name: Registry is in step with its generator
        run: python skills/seo-checklist/tools/build_checklist.py --check

      # signal.Signals has no SIGKILL on Windows, so this legitimately reports
      # OK (skipped=1); unittest still exits zero and no assertion is needed.
      - name: Tests
        run: python -m unittest discover -s tests

      - name: Scripts compile
        run: |
          python -m compileall -q skills/seo-checklist/scripts skills/seo-checklist/tools

      - name: No assertion can never fire
        run: python skills/seo-checklist/tools/audit_assertions.py

      - name: No verdict is unreachable without saying so
        run: python skills/seo-checklist/tools/audit_reachability.py

      - name: Every item asserts what its title says
        run: python skills/seo-checklist/tools/audit_item_semantics.py

      - name: No translation has drifted from its English
        run: python skills/seo-checklist/tools/i18n_digest.py --check

      - name: Public suffix snapshot ships and is dated
        run: python skills/seo-checklist/tools/refresh_public_suffix_list.py --check

      # KNOWN-ISSUES.md is the one file here that makes claims about the code and had
      # no reader, so three entries went on describing a tree that had been repaired
      # underneath them - KW-071 for 36 releases. Each section 6 entry now carries a
      # marker and either a probe or a written reason for having none; this re-runs the
      # probes. A failure is not "fix the code": it is somebody deciding whether the
      # tree moved or the entry is now wrong, and then re-recording.
      - name: The defect list still describes this tree
        run: python tests/known_issues.py --check

      # The other recorded ledger, and the cheap half of the same question. It asserts
      # that the record still describes the tree - which findings each none_severity
      # script can write that no rule reads - and not that any of them is acceptable
      # advice; that judgement has no mechanical form and this tool deliberately makes
      # none. The census answers the same question about verdicts and costs five
      # audits, so it has a job of its own below rather than a step in this matrix.
      - name: The inert-findings record still describes this tree
        run: python tests/inert_findings.py --check tests/inert-findings.json

  # The recorded census is the one ledger whose contents cost a run to reproduce, and
  # until 0.90.2 that was the reason nothing read them: `registry_version` was its whole
  # staleness check, and a stamp is the one field in a record that a hand can set without
  # re-recording anything. The copied registry fields are read by the suite now, in
  # milliseconds. The verdicts are what is left, and the cost was assumed rather than
  # measured - five audits over five served trees is 101 seconds on a developer machine
  # and was 82 on this job's first runner, which finished it two minutes before the
  # matrix beside it finished the suite. It gets a job rather than a step because it
  # needs no matrix: what it compares is the tree's answers, not the interpreter's.
  #
  # A failure here is not "fix the code" either. It is a verdict that moved, and somebody
  # deciding whether the move is the repair they intended before re-recording with
  # `python tests/verdict_census.py --out tests/census.json`.
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: The recorded census still describes this tree
        run: python tests/verdict_census.py --check tests/census.json
